<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Brishkamal">
    <meta name="description" content="Play Chess">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chess Arena</title>
    <link rel="stylesheet" href="../styles/arena.css">
  </head>
  <body>
    <div id="container">
      <div id="info1" class="panel">
        <div id="dynamicOpp" class="dynamic">
          <div id="ot">
            <span id="oppDot"></span></span><span id="opp">OPPONENT</span>
            <span id="oppTime"></span>
          </div>
          <span id="timerOn"></span>
          <div id="cap">
            <span id="oppCaptxt">CAPTURED</span>
            <span id="oppPoint">+0</span>
          </div>
        </div>

        <!-- <div id="gameMoves">
          <span id="moveTxt">Moves</span>
          <div id="accMoves">
            <ol class="moveList">
            </ol>
          </div>
        </div> -->
      </div>
                            
      <div id="chessBorder">
        <canvas id="chessBoard">here is the chess board</canvas>
      </div>

      <div id="info2" class="panel">
        <div id="dynamicYou" class="dynamic">
          <div id="ot">
            <span id="youDot"></span><span id="you">YOU</span>
            <span id="youTime"></span>
          </div>
          <span id="timerOn"></span>
          <div id="cap">
            <span id="youCaptxt">CAPTURED</span>
            <span id="youPoint">+0</span>
          </div>
        </div>

        <div id="gameStatus">
          <div id="promotionOption"></div>
          <div id="gameOptions"></div>
          <div id="gameOption">
            <button id="resign">Resign</button>
            <button id="draw">Draw</button>
            <button id="backToMenu" href="/">Back to Menu</button>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/dom/arena.js" type="module"></script> 
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/chessBoard/board.js" type="module"></script>
  </body>
</html>

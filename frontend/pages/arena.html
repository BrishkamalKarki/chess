<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <meta name="author" content="Brishkamal">
    <meta name="description" content="Play Chess">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Chess Arena</title>
    <link rel="stylesheet" href="../styles/arena.css">
  </head>
  <body>
    <div id="container">
      <section id="info1" class="panel">
        <div class="card">
          <div class="who1">
            <span id="gameMode"></span>
            <span id="color1">You</span>
            <span id="level" ></span>
            <span id="timerOn"></span>
            <span id="netTime"></span>
          </div>
          <div id="clock1" >10:00</div>          
          <span id="lead1"></span>                     
        </div>
      </section>

      <div id="chessBorder">
        <canvas id="chessBoard">here is the chess board</canvas>
      </div>

      <section id="info2" class="panel">
        <div class="card">
          <div class="who2">
            <span id="gameMode"></span>
            <span id="color2">You</span>
            <span id="level" ></span>
            <span id="timerOn"></span>
            <span id="netTime"></span>
          </div>
          <div id="clock2" >10:00</div>          
          <span id="lead2"></span>                     
        </div>
      </section>
    </div>
    <script src="../js/chessBoard/board.js" type="module"></script>
    <script src="/socket.io/socket.io.js"></script>
  </body>
</html>
